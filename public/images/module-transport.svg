<svg viewBox="0 0 800 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="400" rx="16" fill="#f8f9fa"/>

  <!-- TOP: Route visualization -->
  <g transform="translate(60, 30)">
    <!-- Route background area -->
    <rect width="680" height="110" rx="12" fill="#fff" stroke="#e5e7eb" stroke-width="1"/>

    <!-- Route line -->
    <line x1="80" y1="50" x2="600" y2="50" stroke="#e5e7eb" stroke-width="3" stroke-linecap="round"/>
    <!-- Active portion -->
    <line x1="80" y1="50" x2="380" y2="50" stroke="#7c3aed" stroke-width="3" stroke-linecap="round"/>

    <!-- Point A: Скопје -->
    <circle cx="80" cy="50" r="14" fill="#7c3aed" opacity="0.12"/>
    <circle cx="80" cy="50" r="8" fill="#7c3aed"/>
    <text x="80" y="54" font-family="sans-serif" font-size="7" font-weight="700" fill="#fff" text-anchor="middle">А</text>
    <text x="80" y="80" font-family="sans-serif" font-size="10" font-weight="600" fill="#1f2937" text-anchor="middle">Скопје</text>
    <text x="80" y="93" font-family="sans-serif" font-size="8" fill="#9ca3af" text-anchor="middle">06.04 · 08:00</text>

    <!-- Waypoint: Ниш -->
    <circle cx="260" cy="50" r="5" fill="#d1d5db"/>
    <text x="260" y="80" font-family="sans-serif" font-size="9" fill="#9ca3af" text-anchor="middle">Ниш</text>

    <!-- Truck icon on route (at ~55% progress) -->
    <g transform="translate(350, 38)">
      <!-- Truck body -->
      <rect x="0" y="4" width="28" height="14" rx="2" fill="#7c3aed" opacity="0.15"/>
      <rect x="28" y="6" width="12" height="12" rx="2" fill="#7c3aed" opacity="0.25"/>
      <!-- Cab window -->
      <rect x="30" y="7" width="7" height="6" rx="1" fill="#7c3aed" opacity="0.15"/>
      <!-- Wheels -->
      <circle cx="8" cy="20" r="3.5" fill="#7c3aed" opacity="0.4"/>
      <circle cx="22" cy="20" r="3.5" fill="#7c3aed" opacity="0.4"/>
      <circle cx="36" cy="20" r="3.5" fill="#7c3aed" opacity="0.4"/>
    </g>

    <!-- Waypoint: Нови Сад -->
    <circle cx="460" cy="50" r="5" fill="#d1d5db"/>
    <text x="460" y="80" font-family="sans-serif" font-size="9" fill="#9ca3af" text-anchor="middle">Нови Сад</text>

    <!-- Point B: Белград -->
    <circle cx="600" cy="50" r="14" fill="#9ca3af" opacity="0.15"/>
    <circle cx="600" cy="50" r="8" fill="#9ca3af"/>
    <text x="600" y="54" font-family="sans-serif" font-size="7" font-weight="700" fill="#fff" text-anchor="middle">Б</text>
    <text x="600" y="80" font-family="sans-serif" font-size="10" font-weight="600" fill="#1f2937" text-anchor="middle">Белград</text>
    <text x="600" y="93" font-family="sans-serif" font-size="8" fill="#9ca3af" text-anchor="middle">07.04 · 06:00</text>

    <!-- Distance label -->
    <rect x="280" y="16" width="120" height="20" rx="10" fill="#7c3aed" opacity="0.06"/>
    <text x="340" y="30" font-family="sans-serif" font-size="8" font-weight="600" fill="#7c3aed" text-anchor="middle">433 км · ~6 часа</text>
  </g>

  <!-- BOTTOM: Tour detail card -->
  <g transform="translate(60, 160)">
    <rect width="680" height="220" rx="14" fill="#fff" stroke="#e5e7eb" stroke-width="1.5"/>

    <!-- Card header -->
    <rect width="680" height="48" rx="14" fill="#7c3aed" opacity="0.05"/>
    <rect y="36" width="680" height="12" fill="#7c3aed" opacity="0.05"/>

    <!-- Tour number -->
    <rect x="16" y="10" width="32" height="28" rx="6" fill="#7c3aed" opacity="0.12"/>
    <text x="32" y="29" font-family="sans-serif" font-size="11" font-weight="700" fill="#7c3aed" text-anchor="middle">T</text>
    <text x="60" y="28" font-family="sans-serif" font-size="13" font-weight="700" fill="#1f2937">Тура TU-0045</text>
    <!-- Status badge -->
    <rect x="190" y="14" width="60" height="20" rx="10" fill="#22c55e" opacity="0.1"/>
    <text x="220" y="28" font-family="sans-serif" font-size="8" font-weight="600" fill="#22c55e" text-anchor="middle">Во тек</text>
    <!-- Date -->
    <text x="580" y="28" font-family="sans-serif" font-size="9" fill="#9ca3af">06.04.2026</text>

    <!-- Tour details grid -->
    <!-- Row 1: Vehicle -->
    <g transform="translate(20, 60)">
      <rect width="310" height="42" rx="8" fill="#f8f9fa"/>
      <!-- Truck icon -->
      <rect x="12" y="10" width="22" height="14" rx="2" fill="#7c3aed" opacity="0.15"/>
      <rect x="34" y="14" width="10" height="10" rx="2" fill="#7c3aed" opacity="0.2"/>
      <circle cx="18" cy="28" r="3" fill="#7c3aed" opacity="0.2"/>
      <circle cx="28" cy="28" r="3" fill="#7c3aed" opacity="0.2"/>
      <circle cx="40" cy="28" r="3" fill="#7c3aed" opacity="0.2"/>
      <text x="56" y="20" font-family="sans-serif" font-size="8" fill="#9ca3af">Возило</text>
      <text x="56" y="33" font-family="sans-serif" font-size="11" font-weight="600" fill="#1f2937">SK-1234-AB</text>
      <text x="150" y="33" font-family="sans-serif" font-size="9" fill="#9ca3af">MAN TGX 18.500</text>
    </g>

    <!-- Row 1: Driver -->
    <g transform="translate(350, 60)">
      <rect width="310" height="42" rx="8" fill="#f8f9fa"/>
      <!-- Person icon -->
      <circle cx="24" cy="16" r="7" fill="#7c3aed" opacity="0.15"/>
      <circle cx="24" cy="13" r="4" fill="#7c3aed" opacity="0.25"/>
      <ellipse cx="24" cy="22" rx="6" ry="3.5" fill="#7c3aed" opacity="0.2"/>
      <text x="42" y="20" font-family="sans-serif" font-size="8" fill="#9ca3af">Возач</text>
      <text x="42" y="33" font-family="sans-serif" font-size="11" font-weight="600" fill="#1f2937">Г. Петровски</text>
      <text x="150" y="33" font-family="sans-serif" font-size="9" fill="#9ca3af">C+E категорија</text>
    </g>

    <!-- Row 2: Orders list -->
    <g transform="translate(20, 112)">
      <rect width="310" height="42" rx="8" fill="#f8f9fa"/>
      <!-- List icon -->
      <rect x="12" y="12" width="4" height="4" rx="1" fill="#7c3aed" opacity="0.3"/>
      <line x1="20" y1="14" x2="36" y2="14" stroke="#7c3aed" stroke-width="1.5" opacity="0.2"/>
      <rect x="12" y="20" width="4" height="4" rx="1" fill="#7c3aed" opacity="0.3"/>
      <line x1="20" y1="22" x2="32" y2="22" stroke="#7c3aed" stroke-width="1.5" opacity="0.2"/>
      <rect x="12" y="28" width="4" height="4" rx="1" fill="#7c3aed" opacity="0.3"/>
      <line x1="20" y1="30" x2="34" y2="30" stroke="#7c3aed" stroke-width="1.5" opacity="0.2"/>
      <text x="48" y="20" font-family="sans-serif" font-size="8" fill="#9ca3af">Товарни налози</text>
      <text x="48" y="33" font-family="sans-serif" font-size="11" font-weight="600" fill="#1f2937">3 налози</text>
      <text x="120" y="33" font-family="sans-serif" font-size="9" fill="#9ca3af">14.2 тони</text>
    </g>

    <!-- Row 2: Cargo details -->
    <g transform="translate(350, 112)">
      <rect width="310" height="42" rx="8" fill="#f8f9fa"/>
      <!-- Box icon -->
      <rect x="12" y="12" width="20" height="18" rx="2" fill="#7c3aed" opacity="0.15"/>
      <line x1="12" y1="18" x2="32" y2="18" stroke="#7c3aed" stroke-width="1" opacity="0.3"/>
      <line x1="22" y1="12" x2="22" y2="30" stroke="#7c3aed" stroke-width="1" opacity="0.2"/>
      <text x="42" y="20" font-family="sans-serif" font-size="8" fill="#9ca3af">Товар</text>
      <text x="42" y="33" font-family="sans-serif" font-size="11" font-weight="600" fill="#1f2937">Градежни материјали</text>
    </g>

    <!-- Financial summary row -->
    <g transform="translate(20, 168)">
      <!-- Revenue -->
      <rect width="200" height="38" rx="8" fill="#22c55e" opacity="0.04"/>
      <text x="14" y="16" font-family="sans-serif" font-size="8" fill="#9ca3af">Приход</text>
      <text x="14" y="31" font-family="sans-serif" font-size="14" font-weight="700" fill="#22c55e">€3,200</text>

      <!-- Costs -->
      <rect x="210" y="0" width="200" height="38" rx="8" fill="#ef4444" opacity="0.04"/>
      <text x="224" y="16" font-family="sans-serif" font-size="8" fill="#9ca3af">Трошоци</text>
      <text x="224" y="31" font-family="sans-serif" font-size="14" font-weight="700" fill="#ef4444">€2,100</text>
      <!-- Cost breakdown -->
      <text x="310" y="18" font-family="sans-serif" font-size="7" fill="#d1d5db">гориво €1,200 · патарини €400 · дневници €500</text>

      <!-- Profit -->
      <rect x="420" y="0" width="240" height="38" rx="8" fill="#7c3aed" opacity="0.06" stroke="#7c3aed" stroke-width="1" stroke-opacity="0.15"/>
      <text x="434" y="16" font-family="sans-serif" font-size="8" fill="#9ca3af">Профит</text>
      <text x="434" y="31" font-family="sans-serif" font-size="14" font-weight="700" fill="#7c3aed">€1,100</text>
      <!-- Margin -->
      <rect x="520" y="12" width="54" height="18" rx="9" fill="#7c3aed" opacity="0.1"/>
      <text x="547" y="25" font-family="sans-serif" font-size="9" font-weight="600" fill="#7c3aed" text-anchor="middle">34.4%</text>
      <!-- Arrow up -->
      <polygon points="590,26 596,18 602,26" fill="#22c55e" opacity="0.5"/>
    </g>
  </g>
</svg>
