<svg viewBox="0 0 800 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="400" rx="16" fill="#f8f9fa"/>

  <!-- Browser window frame -->
  <g transform="translate(60, 20)">
    <rect width="680" height="360" rx="12" fill="#fff" stroke="#e5e7eb" stroke-width="1.5"/>

    <!-- Browser top bar -->
    <rect width="680" height="36" rx="12" fill="#f8f9fa" stroke="#e5e7eb" stroke-width="1"/>
    <rect y="24" width="680" height="12" fill="#f8f9fa"/>
    <!-- Window dots -->
    <circle cx="20" cy="18" r="5" fill="#ef4444" opacity="0.6"/>
    <circle cx="36" cy="18" r="5" fill="#f59e0b" opacity="0.6"/>
    <circle cx="52" cy="18" r="5" fill="#22c55e" opacity="0.6"/>
    <!-- Tabs -->
    <rect x="70" y="8" width="80" height="22" rx="4" fill="#fff" stroke="#e5e7eb" stroke-width="0.75"/>
    <text x="110" y="23" font-family="sans-serif" font-size="8" fill="#7c3aed" text-anchor="middle" font-weight="600">Контролна</text>
    <rect x="156" y="8" width="70" height="22" rx="4" fill="#f8f9fa"/>
    <text x="191" y="23" font-family="sans-serif" font-size="8" fill="#9ca3af" text-anchor="middle">Возила</text>
    <rect x="232" y="8" width="70" height="22" rx="4" fill="#f8f9fa"/>
    <text x="267" y="23" font-family="sans-serif" font-size="8" fill="#9ca3af" text-anchor="middle">Фактури</text>
    <!-- URL bar -->
    <rect x="320" y="9" width="240" height="20" rx="10" fill="#fff" stroke="#e5e7eb" stroke-width="0.75"/>
    <text x="340" y="23" font-family="sans-serif" font-size="8" fill="#d1d5db">veridex.mk/dashboard</text>

    <!-- Sidebar hint -->
    <rect x="0" y="36" width="48" height="324" fill="#7c3aed" opacity="0.04" rx="0"/>
    <rect x="12" y="52" width="24" height="24" rx="6" fill="#7c3aed" opacity="0.12"/>
    <rect x="16" y="60" width="16" height="2" rx="1" fill="#7c3aed" opacity="0.3"/>
    <rect x="16" y="64" width="16" height="2" rx="1" fill="#7c3aed" opacity="0.3"/>
    <rect x="16" y="68" width="16" height="2" rx="1" fill="#7c3aed" opacity="0.3"/>
    <rect x="12" y="88" width="24" height="24" rx="6" fill="#7c3aed" opacity="0.06"/>
    <rect x="12" y="124" width="24" height="24" rx="6" fill="#7c3aed" opacity="0.06"/>
    <rect x="12" y="160" width="24" height="24" rx="6" fill="#7c3aed" opacity="0.06"/>
    <rect x="12" y="196" width="24" height="24" rx="6" fill="#7c3aed" opacity="0.06"/>

    <!-- Dashboard header -->
    <text x="68" y="62" font-family="sans-serif" font-size="14" font-weight="700" fill="#1f2937">Контролна табла</text>
    <text x="68" y="76" font-family="sans-serif" font-size="9" fill="#9ca3af">Понеделник, 6 април 2026</text>

    <!-- 4 stat cards row -->
    <!-- Card 1: Возила -->
    <g transform="translate(60, 86)">
      <rect width="140" height="64" rx="10" fill="#7c3aed" opacity="0.05" stroke="#7c3aed" stroke-width="0.5" stroke-opacity="0.15"/>
      <!-- Truck icon -->
      <rect x="12" y="14" width="28" height="20" rx="4" fill="#7c3aed" opacity="0.15"/>
      <rect x="18" y="18" width="8" height="4" rx="1" fill="#7c3aed" opacity="0.4"/>
      <rect x="28" y="20" width="8" height="8" rx="2" fill="#7c3aed" opacity="0.3"/>
      <text x="52" y="22" font-family="sans-serif" font-size="8" fill="#9ca3af">Возила</text>
      <text x="52" y="40" font-family="sans-serif" font-size="22" font-weight="700" fill="#7c3aed">12</text>
    </g>

    <!-- Card 2: Возачи -->
    <g transform="translate(210, 86)">
      <rect width="140" height="64" rx="10" fill="#7c3aed" opacity="0.05" stroke="#7c3aed" stroke-width="0.5" stroke-opacity="0.15"/>
      <!-- Person icon -->
      <circle cx="26" cy="18" r="7" fill="#7c3aed" opacity="0.15"/>
      <rect x="18" y="27" width="16" height="8" rx="4" fill="#7c3aed" opacity="0.15"/>
      <text x="52" y="22" font-family="sans-serif" font-size="8" fill="#9ca3af">Возачи</text>
      <text x="52" y="40" font-family="sans-serif" font-size="22" font-weight="700" fill="#7c3aed">47</text>
    </g>

    <!-- Card 3: Тури -->
    <g transform="translate(360, 86)">
      <rect width="140" height="64" rx="10" fill="#22c55e" opacity="0.05" stroke="#22c55e" stroke-width="0.5" stroke-opacity="0.15"/>
      <!-- Route icon -->
      <circle cx="18" cy="18" r="4" fill="#22c55e" opacity="0.3"/>
      <circle cx="34" cy="28" r="4" fill="#22c55e" opacity="0.3"/>
      <line x1="21" y1="20" x2="31" y2="26" stroke="#22c55e" stroke-width="1.5" opacity="0.3"/>
      <text x="52" y="22" font-family="sans-serif" font-size="8" fill="#9ca3af">Тури</text>
      <text x="52" y="40" font-family="sans-serif" font-size="22" font-weight="700" fill="#22c55e">8</text>
      <text x="76" y="40" font-family="sans-serif" font-size="9" fill="#9ca3af">активни</text>
    </g>

    <!-- Card 4: Фактури -->
    <g transform="translate(510, 86)">
      <rect width="140" height="64" rx="10" fill="#f59e0b" opacity="0.05" stroke="#f59e0b" stroke-width="0.5" stroke-opacity="0.15"/>
      <!-- Invoice icon -->
      <rect x="14" y="12" width="22" height="28" rx="3" fill="#f59e0b" opacity="0.15"/>
      <line x1="19" y1="20" x2="31" y2="20" stroke="#f59e0b" stroke-width="1" opacity="0.3"/>
      <line x1="19" y1="25" x2="28" y2="25" stroke="#f59e0b" stroke-width="1" opacity="0.3"/>
      <line x1="19" y1="30" x2="31" y2="30" stroke="#f59e0b" stroke-width="1" opacity="0.3"/>
      <text x="52" y="22" font-family="sans-serif" font-size="8" fill="#9ca3af">Фактури</text>
      <text x="52" y="40" font-family="sans-serif" font-size="22" font-weight="700" fill="#f59e0b">156</text>
    </g>

    <!-- Active tours table -->
    <g transform="translate(60, 164)">
      <text x="0" y="0" font-family="sans-serif" font-size="11" font-weight="600" fill="#1f2937">Активни тури</text>

      <!-- Table header -->
      <g transform="translate(0, 12)">
        <rect width="590" height="24" rx="4" fill="#f8f9fa"/>
        <text x="12" y="16" font-family="sans-serif" font-size="8" font-weight="600" fill="#9ca3af">ВОЗИЛО</text>
        <text x="120" y="16" font-family="sans-serif" font-size="8" font-weight="600" fill="#9ca3af">ВОЗАЧ</text>
        <text x="250" y="16" font-family="sans-serif" font-size="8" font-weight="600" fill="#9ca3af">РУТА</text>
        <text x="450" y="16" font-family="sans-serif" font-size="8" font-weight="600" fill="#9ca3af">СТАТУС</text>
        <text x="540" y="16" font-family="sans-serif" font-size="8" font-weight="600" fill="#9ca3af">ПРОФИТ</text>
      </g>

      <!-- Row 1 -->
      <g transform="translate(0, 40)">
        <rect width="590" height="30" rx="4" fill="#fff"/>
        <line x1="0" y1="30" x2="590" y2="30" stroke="#f8f9fa" stroke-width="1"/>
        <text x="12" y="20" font-family="sans-serif" font-size="9" font-weight="600" fill="#1f2937">SK-1234-AB</text>
        <text x="120" y="20" font-family="sans-serif" font-size="9" fill="#6b7280">Г. Петровски</text>
        <text x="250" y="20" font-family="sans-serif" font-size="9" fill="#6b7280">Скопје → Белград</text>
        <rect x="445" y="8" width="52" height="18" rx="9" fill="#22c55e" opacity="0.1"/>
        <text x="471" y="21" font-family="sans-serif" font-size="8" font-weight="600" fill="#22c55e" text-anchor="middle">Во тек</text>
        <text x="540" y="20" font-family="sans-serif" font-size="9" font-weight="600" fill="#22c55e">€1,100</text>
      </g>

      <!-- Row 2 -->
      <g transform="translate(0, 72)">
        <rect width="590" height="30" rx="4" fill="#f8f9fa" opacity="0.5"/>
        <line x1="0" y1="30" x2="590" y2="30" stroke="#f8f9fa" stroke-width="1"/>
        <text x="12" y="20" font-family="sans-serif" font-size="9" font-weight="600" fill="#1f2937">BT-5678-CD</text>
        <text x="120" y="20" font-family="sans-serif" font-size="9" fill="#6b7280">М. Јовановски</text>
        <text x="250" y="20" font-family="sans-serif" font-size="9" fill="#6b7280">Битола → Солун</text>
        <rect x="445" y="8" width="52" height="18" rx="9" fill="#22c55e" opacity="0.1"/>
        <text x="471" y="21" font-family="sans-serif" font-size="8" font-weight="600" fill="#22c55e" text-anchor="middle">Во тек</text>
        <text x="540" y="20" font-family="sans-serif" font-size="9" font-weight="600" fill="#22c55e">€850</text>
      </g>

      <!-- Row 3 -->
      <g transform="translate(0, 104)">
        <rect width="590" height="30" rx="4" fill="#fff"/>
        <text x="12" y="20" font-family="sans-serif" font-size="9" font-weight="600" fill="#1f2937">OH-9012-EF</text>
        <text x="120" y="20" font-family="sans-serif" font-size="9" fill="#6b7280">С. Трајковски</text>
        <text x="250" y="20" font-family="sans-serif" font-size="9" fill="#6b7280">Охрид → Тирана</text>
        <rect x="445" y="8" width="52" height="18" rx="9" fill="#f59e0b" opacity="0.1"/>
        <text x="471" y="21" font-family="sans-serif" font-size="8" font-weight="600" fill="#f59e0b" text-anchor="middle">Чека</text>
        <text x="540" y="20" font-family="sans-serif" font-size="9" font-weight="600" fill="#9ca3af">€0</text>
      </g>
    </g>
  </g>
</svg>
