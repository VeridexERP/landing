<svg viewBox="0 0 800 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="400" rx="16" fill="#f8f9fa"/>

  <!-- Connecting lines between cards (behind everything) -->
  <line x1="340" y1="160" x2="460" y2="160" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.25"/>
  <line x1="340" y1="200" x2="460" y2="200" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.25"/>
  <line x1="340" y1="240" x2="460" y2="240" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.25"/>
  <!-- Arrow tips -->
  <polygon points="456,156 464,160 456,164" fill="#7c3aed" opacity="0.25"/>
  <polygon points="456,196 464,200 456,204" fill="#7c3aed" opacity="0.25"/>
  <polygon points="456,236 464,240 456,244" fill="#7c3aed" opacity="0.25"/>

  <!-- LEFT SIDE: Company card -->
  <g transform="translate(40, 50)">
    <rect width="300" height="300" rx="14" fill="#fff" stroke="#e5e7eb" stroke-width="1.5"/>

    <!-- Card header -->
    <rect width="300" height="52" rx="14" fill="#7c3aed" opacity="0.06"/>
    <rect y="40" width="300" height="12" fill="#7c3aed" opacity="0.06"/>

    <!-- Building icon -->
    <g transform="translate(20, 12)">
      <rect x="0" y="4" width="24" height="22" rx="3" fill="#7c3aed" opacity="0.2"/>
      <rect x="4" y="8" width="5" height="5" rx="1" fill="#7c3aed" opacity="0.4"/>
      <rect x="14" y="8" width="5" height="5" rx="1" fill="#7c3aed" opacity="0.4"/>
      <rect x="4" y="17" width="5" height="5" rx="1" fill="#7c3aed" opacity="0.4"/>
      <rect x="14" y="17" width="5" height="5" rx="1" fill="#7c3aed" opacity="0.4"/>
    </g>

    <text x="54" y="26" font-family="sans-serif" font-size="11" font-weight="700" fill="#1f2937">Транспорт Петрови ДООЕЛ</text>
    <text x="54" y="40" font-family="sans-serif" font-size="9" fill="#9ca3af">Скопје, Македонија</text>

    <!-- Company details -->
    <!-- Tax ID -->
    <g transform="translate(20, 70)">
      <rect width="260" height="44" rx="8" fill="#f8f9fa"/>
      <!-- ID card icon -->
      <rect x="12" y="10" width="24" height="18" rx="3" fill="#7c3aed" opacity="0.15"/>
      <line x1="17" y1="16" x2="31" y2="16" stroke="#7c3aed" stroke-width="1.5" opacity="0.3"/>
      <line x1="17" y1="21" x2="27" y2="21" stroke="#7c3aed" stroke-width="1" opacity="0.3"/>
      <text x="48" y="20" font-family="sans-serif" font-size="8" fill="#9ca3af">Даночен број (ЕДБ)</text>
      <text x="48" y="33" font-family="sans-serif" font-size="11" font-weight="600" fill="#1f2937">MK4030012345678</text>
    </g>

    <!-- Bank account -->
    <g transform="translate(20, 124)">
      <rect width="260" height="44" rx="8" fill="#f8f9fa"/>
      <!-- Bank icon -->
      <rect x="14" y="16" width="20" height="10" rx="2" fill="#7c3aed" opacity="0.15"/>
      <rect x="12" y="12" width="24" height="6" rx="2" fill="#7c3aed" opacity="0.15"/>
      <line x1="18" y1="18" x2="18" y2="24" stroke="#7c3aed" stroke-width="1.5" opacity="0.3"/>
      <line x1="24" y1="18" x2="24" y2="24" stroke="#7c3aed" stroke-width="1.5" opacity="0.3"/>
      <line x1="30" y1="18" x2="30" y2="24" stroke="#7c3aed" stroke-width="1.5" opacity="0.3"/>
      <text x="48" y="20" font-family="sans-serif" font-size="8" fill="#9ca3af">Трансакциска сметка</text>
      <text x="48" y="33" font-family="sans-serif" font-size="11" font-weight="600" fill="#1f2937">300-0001234567-89</text>
    </g>

    <!-- Documents stack -->
    <g transform="translate(20, 178)">
      <rect width="260" height="44" rx="8" fill="#f8f9fa"/>
      <!-- Stacked docs icon -->
      <rect x="16" y="10" width="18" height="22" rx="2" fill="#7c3aed" opacity="0.1"/>
      <rect x="14" y="12" width="18" height="22" rx="2" fill="#7c3aed" opacity="0.15"/>
      <rect x="12" y="14" width="18" height="22" rx="2" fill="#7c3aed" opacity="0.2"/>
      <line x1="15" y1="20" x2="27" y2="20" stroke="#7c3aed" stroke-width="1" opacity="0.3"/>
      <line x1="15" y1="25" x2="24" y2="25" stroke="#7c3aed" stroke-width="1" opacity="0.3"/>
      <line x1="15" y1="30" x2="27" y2="30" stroke="#7c3aed" stroke-width="1" opacity="0.3"/>
      <text x="48" y="20" font-family="sans-serif" font-size="8" fill="#9ca3af">Документи</text>
      <text x="48" y="33" font-family="sans-serif" font-size="11" font-weight="600" fill="#1f2937">12 документи</text>
    </g>

    <!-- Stats row -->
    <g transform="translate(20, 236)">
      <rect width="126" height="46" rx="8" fill="#7c3aed" opacity="0.04"/>
      <text x="14" y="20" font-family="sans-serif" font-size="8" fill="#9ca3af">Вработени</text>
      <text x="14" y="36" font-family="sans-serif" font-size="16" font-weight="700" fill="#7c3aed">47</text>

      <rect x="134" y="0" width="126" height="46" rx="8" fill="#22c55e" opacity="0.04"/>
      <text x="148" y="20" font-family="sans-serif" font-size="8" fill="#9ca3af">Возила</text>
      <text x="148" y="36" font-family="sans-serif" font-size="16" font-weight="700" fill="#22c55e">12</text>
    </g>
  </g>

  <!-- RIGHT SIDE: Employee/Driver card -->
  <g transform="translate(460, 50)">
    <rect width="300" height="300" rx="14" fill="#fff" stroke="#e5e7eb" stroke-width="1.5"/>

    <!-- Card header -->
    <rect width="300" height="52" rx="14" fill="#7c3aed" opacity="0.06"/>
    <rect y="40" width="300" height="12" fill="#7c3aed" opacity="0.06"/>

    <!-- Person avatar -->
    <g transform="translate(20, 8)">
      <circle cx="16" cy="14" r="12" fill="#7c3aed" opacity="0.15"/>
      <circle cx="16" cy="10" r="5" fill="#7c3aed" opacity="0.3"/>
      <ellipse cx="16" cy="22" rx="8" ry="5" fill="#7c3aed" opacity="0.25"/>
    </g>

    <text x="54" y="22" font-family="sans-serif" font-size="11" font-weight="700" fill="#1f2937">Горан Петровски</text>
    <rect x="54" y="28" width="44" height="16" rx="8" fill="#22c55e" opacity="0.1"/>
    <text x="76" y="40" font-family="sans-serif" font-size="8" font-weight="600" fill="#22c55e" text-anchor="middle">Возач</text>

    <!-- CDL / Steering wheel -->
    <g transform="translate(20, 70)">
      <rect width="260" height="44" rx="8" fill="#f8f9fa"/>
      <!-- Steering wheel icon -->
      <circle cx="24" cy="22" r="10" fill="none" stroke="#7c3aed" stroke-width="1.5" opacity="0.3"/>
      <circle cx="24" cy="22" r="3" fill="#7c3aed" opacity="0.2"/>
      <line x1="24" y1="15" x2="24" y2="19" stroke="#7c3aed" stroke-width="1.5" opacity="0.3"/>
      <line x1="18" y1="27" x2="21" y2="24" stroke="#7c3aed" stroke-width="1.5" opacity="0.3"/>
      <line x1="30" y1="27" x2="27" y2="24" stroke="#7c3aed" stroke-width="1.5" opacity="0.3"/>
      <text x="48" y="18" font-family="sans-serif" font-size="8" fill="#9ca3af">Возачка дозвола (CDL)</text>
      <text x="48" y="31" font-family="sans-serif" font-size="11" font-weight="600" fill="#1f2937">C+E категорија</text>
      <rect x="190" y="13" width="56" height="18" rx="9" fill="#22c55e" opacity="0.1"/>
      <text x="218" y="26" font-family="sans-serif" font-size="8" font-weight="600" fill="#22c55e" text-anchor="middle">Валидна</text>
    </g>

    <!-- Medical certificate -->
    <g transform="translate(20, 124)">
      <rect width="260" height="44" rx="8" fill="#f8f9fa"/>
      <!-- Heart/cross icon -->
      <rect x="19" y="14" width="10" height="16" rx="2" fill="#7c3aed" opacity="0.2"/>
      <rect x="16" y="19" width="16" height="6" rx="2" fill="#7c3aed" opacity="0.2"/>
      <text x="48" y="18" font-family="sans-serif" font-size="8" fill="#9ca3af">Лекарско уверение</text>
      <text x="48" y="31" font-family="sans-serif" font-size="11" font-weight="600" fill="#1f2937">Важи до 15.09.2026</text>
      <rect x="190" y="13" width="56" height="18" rx="9" fill="#22c55e" opacity="0.1"/>
      <text x="218" y="26" font-family="sans-serif" font-size="8" font-weight="600" fill="#22c55e" text-anchor="middle">Валидно</text>
    </g>

    <!-- Contract -->
    <g transform="translate(20, 178)">
      <rect width="260" height="44" rx="8" fill="#f8f9fa"/>
      <!-- Document with signature icon -->
      <rect x="14" y="12" width="20" height="24" rx="2" fill="#7c3aed" opacity="0.15"/>
      <line x1="18" y1="18" x2="30" y2="18" stroke="#7c3aed" stroke-width="1" opacity="0.3"/>
      <line x1="18" y1="23" x2="28" y2="23" stroke="#7c3aed" stroke-width="1" opacity="0.3"/>
      <path d="M19 30 Q22 27 25 30 Q28 33 31 30" stroke="#7c3aed" stroke-width="1" fill="none" opacity="0.4"/>
      <text x="48" y="18" font-family="sans-serif" font-size="8" fill="#9ca3af">Договор за вработување</text>
      <text x="48" y="31" font-family="sans-serif" font-size="11" font-weight="600" fill="#1f2937">Неопределено време</text>
      <rect x="190" y="13" width="56" height="18" rx="9" fill="#7c3aed" opacity="0.1"/>
      <text x="218" y="26" font-family="sans-serif" font-size="8" font-weight="600" fill="#7c3aed" text-anchor="middle">Активен</text>
    </g>

    <!-- Work summary -->
    <g transform="translate(20, 236)">
      <rect width="126" height="46" rx="8" fill="#7c3aed" opacity="0.04"/>
      <text x="14" y="20" font-family="sans-serif" font-size="8" fill="#9ca3af">Тури овој месец</text>
      <text x="14" y="36" font-family="sans-serif" font-size="16" font-weight="700" fill="#7c3aed">6</text>

      <rect x="134" y="0" width="126" height="46" rx="8" fill="#22c55e" opacity="0.04"/>
      <text x="148" y="20" font-family="sans-serif" font-size="8" fill="#9ca3af">Километри</text>
      <text x="148" y="36" font-family="sans-serif" font-size="16" font-weight="700" fill="#22c55e">8,420</text>
    </g>
  </g>

  <!-- Bottom label -->
  <text x="400" y="380" font-family="sans-serif" font-size="10" fill="#d1d5db" text-anchor="middle">Организација — фирми, вработени, документи</text>
</svg>
